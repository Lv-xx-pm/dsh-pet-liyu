<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>鲤鱼信箱</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #111; -webkit-user-select: none; user-select: none;
  }
  .card {
    position: absolute; inset: 6px; background: #fff; border: 3px solid #111; border-radius: 26px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 18px 40px rgba(17, 17, 17, .18);
  }
  .head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; }
  .pill { background: #BCD6F7; border: 2px solid #111; border-radius: 999px; padding: 5px 16px; font-size: 15px; font-weight: 700; }
  .state { font-size: 12px; color: #8A94A6; margin-left: auto; }
  .close { width: 26px; height: 26px; border: 0; background: transparent; color: #8A94A6; font-size: 20px; line-height: 1; border-radius: 50%; cursor: pointer; }
  .close:hover { background: #F2F4F8; color: #111; }

  .list { flex: 1; overflow-y: auto; padding: 4px 14px 8px; display: flex; flex-direction: column; gap: 12px; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #DDE3EC; border-radius: 3px; }
  .empty { color: #8A94A6; font-size: 13px; text-align: center; margin: auto; line-height: 1.9; white-space: pre-wrap; }

  .row { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .row.mine { align-items: flex-end; }
  .who { font-size: 11px; color: #8A94A6; padding: 0 4px; }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 18px; border: 2px solid #111; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text; }
  .row:not(.mine) .bubble { background: #fff; border-bottom-left-radius: 6px; }
  .row.mine .bubble { background: #BCD6F7; border-bottom-right-radius: 6px; }

  .foot { border-top: 1px solid #E7EBF2; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .say { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; border: 1px solid #D6DEEA; border-radius: 999px; padding: 9px 14px; font-size: 13.5px; outline: none; background: #F7F9FC; color: #111; font-family: inherit; }
  input:focus { border-color: #2F6FED; background: #fff; }
  button.send { border: 0; border-radius: 999px; background: #2F6FED; color: #fff; font-size: 13.5px; font-weight: 700; padding: 9px 18px; cursor: pointer; font-family: inherit; }
  button.send:disabled { opacity: .5; cursor: default; }
  .tip { font-size: 11px; color: #8A94A6; text-align: right; min-height: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="pill">鲤鱼信箱</div>
      <span class="state" id="state">连接中</span>
      <button class="close" id="close" title="关闭">×</button>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <div class="say">
        <input id="input" placeholder="说点什么…" maxlength="2000" autocomplete="off" />
        <button class="send" id="send">发送</button>
      </div>
      <div class="tip" id="tip"></div>
    </div>
  </div>
  <script src="./liyu-panel.js"></script>
</body>
</html>
